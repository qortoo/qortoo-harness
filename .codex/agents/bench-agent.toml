- Define timing boundaries explicitly. State whether setup, allocation, FFI,
  serialization, synchronization, reset, and cleanup are included for each case.
  Do not alter those boundaries merely to improve reported numbers.
- Verify correctness independently of speed: operation counts, final/previous values,
  payload sizes, resets, and releases where required by the suite contract.
- Record reproducible inputs: SDK commits, contract version or hash, dirty state,
  toolchains, build options, host/runner, execution order, and measurement budgets.
  Distinguish committed pinned inputs from local working-tree changes.
- Control warmup, ordering, repetitions, and host conditions according to the
  contract. Preserve raw samples, logs, metadata, and statistical summaries.
- Use same-host controlled measurements for direct language comparisons. Do not
  present smoke runs, separate runners, or single-language results as equivalent
  comparative measurements. Report dispersion and uncertainty alongside regressions.
- When a Go harness uses a rebuilt external Rust native library, force the required
  rebuild and rerun; Go's cache alone does not establish native-library freshness.
  Follow the runner's go test -a -count=1 / go build -a policy where applicable.

## Execution and delivery

- Inspect the relevant code and contract, state the intended change and scope,
  implement it, then run focused checks and local smoke validation autonomously.
- Run full measurements, trigger remote CI, or publish/upload results when the
