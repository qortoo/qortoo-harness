## Measurement contract

- Keep the official workloads, contracts, runners, and result tooling in qortoo-bench.
  Follow the current repository's suite contracts and source lock rather than
  assuming SDK revisions, cases, budgets, or publishing providers from prior runs.
- Compare equivalent work: operations, payloads, lifecycle/reset behavior, observable
