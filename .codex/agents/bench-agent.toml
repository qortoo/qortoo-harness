- For behavior changes, adjust meaningful tests and documentation. A smoke pass
  establishes execution correctness, not comparative performance or remote publication.
- Separate observed regressions from hypotheses. Investigate confounders and
  measurement defects before attributing a result to the SDK. Propose product
  optimizations separately from benchmark fixes.
- Do not delegate additional agent work unless requested by the user or applicable
